<!doctype html>
<meta charset="utf-8">
<title>Pick — mini</title>
<link rel="icon" type="image/png" href="/static/pick-favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Its own page rather than the app squeezed into a small window: all of it
     is a remote for the main window, which is the only thing making sound. */
  :root{
    --bg:#08080b; --text:#f4f4f6; --sub:rgba(255,255,255,.62); --dim:rgba(255,255,255,.38);
    --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.13); --line:rgba(255,255,255,.10);
    --accent:#ff5a1f; --accent2:#ffb347;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  /* The cover, huge and blurred, is the backdrop; the accent is taken from it. */
  .backdrop{position:fixed;inset:-60px;background:#111 center/cover no-repeat;
    filter:blur(42px) saturate(1.5) brightness(.55);transform:scale(1.15);
    transition:background-image .6s, opacity .6s;z-index:0}
  .shade{position:fixed;inset:0;z-index:0;
    background:radial-gradient(120% 70% at 50% 0%, transparent, rgba(0,0,0,.55) 70%),
               linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.72))}
  .wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;
    padding:12px 16px 14px;gap:10px}

  /* ---- tabs ---- */
  .top{display:flex;align-items:center;gap:8px}
  .tabs{flex:1;display:flex;gap:2px;padding:3px;border-radius:11px;background:rgba(0,0,0,.32);
    border:1px solid var(--line);backdrop-filter:blur(8px)}
  .tab{flex:1;height:28px;border-radius:8px;border:0;background:none;color:var(--sub);
    font-weight:600;font-size:11.5px;line-height:1;font-family:inherit;display:flex;align-items:center;justify-content:center;
    gap:5px;cursor:pointer;transition:background .15s,color .15s}
  .tab:hover{color:var(--text)}
  .tab.on{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .tab svg{opacity:.9}
  .iconbtn{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);
    background:rgba(0,0,0,.32);color:var(--sub);cursor:pointer;display:flex;align-items:center;
    justify-content:center;position:relative;transition:color .15s, border-color .15s}
  .iconbtn:hover{color:var(--text)}
  .iconbtn.on{color:var(--accent2);border-color:color-mix(in srgb, var(--accent) 60%, transparent)}
  .iconbtn .badge{position:absolute;bottom:-5px;right:-5px;font-weight:700;font-size:9px;line-height:1;font-family:inherit;
    padding:2px 4px;border-radius:6px;background:var(--accent);color:#000}

  /* ---- stage ---- */
  .stage{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none;animation:fade .25s ease}
  .pane.on{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Cover: a record that spins while music plays, with a tone arm — and it
     can be scratched: drag it round to scrub through the song. */
  #pane-cover{align-items:center;justify-content:center}
  .deck{position:relative;width:min(100%, 300px);aspect-ratio:1}
  .vinyl{position:absolute;inset:4%;border-radius:50%;cursor:grab;touch-action:none;
    background:
      radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.05) 31.5% 32%, transparent 32.5%),
      repeating-radial-gradient(circle, #121214 0 1.6px, #1b1b1f 1.6px 3.2px),
      #141416;
    box-shadow:0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06),
               0 0 60px color-mix(in srgb, var(--accent) 22%, transparent)}
  .vinyl:active{cursor:grabbing}
  .vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.10) 14%, transparent 20% 55%,
      rgba(255,255,255,.08) 62%, transparent 68%)}
  .label{position:absolute;inset:32%;border-radius:50%;background:#222 center/cover no-repeat;
    box-shadow:0 0 0 3px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12);display:flex;
    align-items:center;justify-content:center;color:var(--dim)}
  .label::after{content:"";width:9%;height:9%;border-radius:50%;background:#0b0b0d;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .arm{position:absolute;top:-2%;right:2%;width:34%;height:62%;pointer-events:none;
    transform-origin:78% 12%;transform:rotate(-26deg);transition:transform .7s cubic-bezier(.3,1.4,.5,1);
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
  .playing .arm{transform:rotate(0deg)}
  .scrub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-weight:800;font-size:22px;line-height:1;font-family:inherit;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:12px;
    background:rgba(0,0,0,.7);color:var(--accent2);pointer-events:none;opacity:0;transition:opacity .15s}
  .scrub.on{opacity:1}

  /* Video */
  #pane-video{flex-direction:column;gap:8px}
  .screen{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 0 1px var(--line)}
  .screen video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .screen iframe[hidden], .screen video[hidden]{display:none}
  .screen .msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;
    justify-content:center;color:var(--sub);font-size:12px;text-align:center;padding:20px}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--accent);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .vbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
  #smode{flex-wrap:wrap}
  /* "Say it again!!!": the logo, large and see-through, over the middle of the window; nothing behind it is covered. */
  .voice-again{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;pointer-events:none}
  .voice-again[hidden]{display:none}
  .voice-again img{width:min(46vh,46vw);height:auto;opacity:.5;filter:drop-shadow(0 0 60px rgba(30,215,96,.75)) drop-shadow(0 0 140px rgba(30,215,96,.4));animation:vagain .46s ease-in-out infinite alternate}
  .voice-again b{font-size:min(9vh,7vw);font-weight:900;letter-spacing:.02em;color:rgba(255,255,255,.82);text-align:center;padding:0 4vw;
    text-shadow:0 0 28px rgba(30,215,96,.85),0 0 80px rgba(30,215,96,.5),0 2px 10px rgba(0,0,0,.6);animation:vagain .46s ease-in-out infinite alternate}
  @keyframes vagain{from{opacity:.12;transform:scale(.94)}to{opacity:.62;transform:scale(1.05)}}
  .seg{display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
  .seg button{border:0;background:none;color:var(--sub);font-weight:600;font-size:11px;line-height:1;font-family:inherit;
    padding:5px 9px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--glass2);color:var(--text)}
  .vbar .sp{flex:1}
  .chip{border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--sub);border-radius:7px;
    font-weight:600;font-size:11px;line-height:1;font-family:inherit;padding:5px 7px;cursor:pointer}
  .chip:hover{color:var(--text)}
  #voff{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

  /* Lyrics: karaoke — the current line lit in the accent, the rest dimmed. */
  #pane-lyrics{flex-direction:column}
  .lyrics{flex:1;overflow-y:auto;padding:38% 4px 45%;scroll-behavior:smooth;
    mask-image:linear-gradient(180deg, transparent, #000 18%, #000 78%, transparent);
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 18%, #000 78%, transparent);
    scrollbar-width:none}
  .lyrics::-webkit-scrollbar{display:none}
  .ln{font-size:19px;font-weight:800;line-height:1.3;margin:0 0 12px;color:rgba(255,255,255,.28);
    cursor:pointer;transition:color .25s, transform .25s, filter .25s;transform-origin:left center;
    filter:blur(.4px)}
  .ln:hover{color:rgba(255,255,255,.55)}
  .ln.past{color:rgba(255,255,255,.42)}
  .ln.cur{color:#fff;transform:scale(1.04);filter:none;
    text-shadow:0 0 22px color-mix(in srgb, var(--accent) 70%, transparent)}
  .ln.cur .fill{background:linear-gradient(90deg, var(--accent2) var(--p,0%), #fff var(--p,0%));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lbar{padding-top:6px}
  .plain{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--sub);padding:0 4px}
  .empty{margin:auto;color:var(--sub);font-size:12px;text-align:center;line-height:1.6}

  /* Queue */
  #pane-queue{flex-direction:column}
  .queue{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
  .qi{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer;
    transition:background .12s}
  .qi:hover{background:var(--glass)}
  .qi.cur{background:color-mix(in srgb, var(--accent) 18%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent)}
  .qi .n{width:18px;text-align:right;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  #sres .qi .n{width:24px;flex:0 0 auto;font-size:12px}
  .qi .th{width:38px;height:38px;border-radius:6px;background:#222 center/cover no-repeat;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:var(--dim)}
  .qi .m{min-width:0;flex:1}
  .qi .m b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qi .m span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qhead{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}

  /* ---- now playing ---- */
  .meta{display:flex;align-items:flex-end;gap:10px;min-width:0}
  .meta .txt{min-width:0;flex:1}
  .marquee{overflow:hidden;white-space:nowrap;font-size:18px;font-weight:800;letter-spacing:-.01em;
    mask-image:linear-gradient(90deg, #000 88%, transparent);-webkit-mask-image:linear-gradient(90deg, #000 88%, transparent)}
  .marquee span{display:inline-block;padding-right:40px}
  .marquee.run span{animation:mq var(--mq,10s) linear infinite}
  @keyframes mq{0%,15%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  .artist{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  /* Bars that dance while music plays (they only pretend — this window has no audio). */
  .eq{display:flex;align-items:flex-end;gap:2px;height:18px;flex:0 0 auto;padding-bottom:4px}
  .eq i{width:3px;height:3px;border-radius:2px;background:linear-gradient(0deg, var(--accent), var(--accent2))}
  .playing .eq i{animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.4s!important;animation-duration:.8s!important}
  .eq i:nth-child(3){animation-delay:-.7s!important;animation-duration:1.15s!important}
  .eq i:nth-child(4){animation-delay:-.2s!important;animation-duration:.9s!important}
  @keyframes eq{0%,100%{height:3px}50%{height:16px}}

  .bar{display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}
  .bar .time{font-size:10.5px;color:var(--sub);flex:0 0 auto;min-width:32px}
  .bar .time.right{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;outline:none;
    cursor:pointer;background:linear-gradient(90deg, var(--accent), var(--accent2)) 0/var(--v,0%) 100% no-repeat,
    rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), 0 1px 4px rgba(0,0,0,.6);
    opacity:0;transition:opacity .15s}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  input[type=range]:disabled{opacity:.45;cursor:default}

  .controls{display:flex;align-items:center;justify-content:center;gap:14px}
  .ctl{border:none;background:none;color:var(--text);cursor:pointer;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;transition:background .12s, transform .12s}
  .ctl:hover{background:var(--glass)}
  .ctl:active{transform:scale(.92)}
  .ctl.small{width:32px;height:32px;color:var(--sub)}
  .ctl.small:hover{color:var(--text)}
  .play{width:56px;height:56px;color:#160800;
    background:radial-gradient(circle at 35% 30%, var(--accent2), var(--accent));
    box-shadow:0 8px 26px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.35)}
  .play:hover{background:radial-gradient(circle at 35% 30%, var(--accent2), var(--accent));transform:scale(1.05)}
  .vol{display:flex;align-items:center;gap:8px}
  .offline{font-size:11.5px;color:var(--sub);text-align:center}
  .offline a{color:var(--accent2)}
  .toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%, 20px);opacity:0;z-index:5;
    background:rgba(0,0,0,.82);border:1px solid var(--line);padding:7px 12px;border-radius:9px;font-size:12px;
    transition:opacity .2s, transform .2s;pointer-events:none;max-width:calc(100vw - 24px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%, 0)}
  /* ---- layouts: compact (small window), tabs (tall), wide (side by side) ---- */
  .mart{display:none;width:52px;height:52px;flex:0 0 auto;border-radius:8px;background:#222 center/cover no-repeat;
    box-shadow:0 4px 14px rgba(0,0,0,.5);align-items:center;justify-content:center;color:var(--dim)}
  .mini-size{display:none;width:28px;height:28px}
  body.compact .wrap{padding:10px 12px;gap:7px}
  body.compact .top, body.compact .stage, body.compact .vol{display:none}
  body.compact .mart{display:flex}
  body.compact .mini-size{display:flex}
  body.compact .meta{align-items:center}
  body.compact .marquee{font-size:14.5px}
  body.compact .artist{font-size:11.5px}
  body.compact .controls{gap:6px}
  body.compact .ctl{width:32px;height:32px}
  body.compact .play{width:42px;height:42px}
  body.compact .ctl svg{transform:scale(.85)}
  body.compact .offline{display:none}
  /* Wide: video | lyrics | queue, all at once. */
  body.wide .tabs .tab{display:none}
  body.wide .tabs{visibility:hidden}
  body.wide .stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.85fr);gap:14px}
  body.wide .pane{position:relative;inset:auto;display:none;min-height:0}
  body.wide #pane-video, body.wide #pane-lyrics, body.wide #pane-queue{display:flex}
  body.wide #pane-lyrics{background:rgba(0,0,0,.22);border-radius:14px;padding:0 10px 8px;border:1px solid var(--line)}
  body.wide #pane-queue{background:rgba(0,0,0,.22);border-radius:14px;padding:10px 8px;border:1px solid var(--line)}
  body.wide .lyrics{padding:30% 4px 40%}
  body.wide .ln{font-size:17px}
  /* narrow window: only the active tab keeps its name */
  @media (max-width: 460px){ .tab:not(.on) span{display:none} .tab{flex:0 0 auto;padding:0 9px} .tab.on{flex:1} }
  /* the tab strip */
  .tabbtn{width:auto;padding:0 10px;font-weight:800;font-size:11px;letter-spacing:.06em}
  .tabbtn.on{color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
  .tabrow{display:none;flex-direction:column;gap:5px;flex:0 0 auto}
  body.tab-on:not(.compact) .tabrow{display:flex}
  .tbar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
  .tbar .tname{color:var(--text);font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .tbarlbl{color:var(--accent2);font-variant-numeric:tabular-nums;min-width:56px}
  .tbar select{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:7px;font-size:11px;padding:3px 5px;max-width:190px}
  .tbar .sp{flex:1}
  .tbar .chip:disabled{opacity:.35;cursor:default}
  .tbar .chip.on{color:#ffd166;border-color:#ffd166}
  .tbar .chip.armed{color:#0a0a0c;background:var(--accent2);border-color:var(--accent2)}
  .tvp{position:relative;height:170px;border-radius:12px;overflow:hidden;background:#f4f4f2;cursor:grab;touch-action:none;
    box-shadow:0 8px 26px rgba(0,0,0,.45), 0 0 0 1px var(--line)}
  .tvp:active{cursor:grabbing}
  .thost{position:absolute;left:0;top:0;width:100%;will-change:transform}
  .tmark{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--accent);opacity:.75;pointer-events:none;
    box-shadow:0 0 10px var(--accent)}
  .tmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:#555;font-size:12.5px;background:#f4f4f2}
  .tmsg[hidden]{display:none}
  body.tab-on.tabs-mode .tvp{height:140px}
  /* search */
  #pane-search{flex-direction:column;gap:8px}
  .vhelp{position:fixed;inset:10px;z-index:90;display:flex;flex-direction:column;background:rgba(14,14,18,.97);border:1px solid var(--accent);border-radius:14px;color:#fff}
  .vhelp[hidden]{display:none}
  .vhelp .vh-head{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--accent2);border-bottom:1px solid var(--line)}
  .vhelp .vh-head span{flex:1}
  .vhelp .vh-head button{border:0;background:none;color:#aaa;font-size:15px;cursor:pointer}
  .vhelp .vh-list{overflow-y:auto;padding:10px 12px;columns:3 250px;column-gap:14px}
  .vhelp .g{break-inside:avoid;margin-bottom:9px;padding:7px 9px 7px 10px;border-radius:9px;border-left:3px solid var(--gc);background:color-mix(in srgb, var(--gc) 9%, transparent)}
  .vhelp h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gc);display:flex;align-items:center;gap:6px}
  .vhelp h4 .ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb, var(--gc) 22%, transparent)}
  .vhelp .r{display:flex;gap:8px;align-items:baseline;padding:1.5px 0;font-size:12px}
  .vhelp .r b{flex:none;white-space:nowrap;color:color-mix(in srgb, var(--gc) 55%, #fff)}
  .vhelp .r span{color:#9a9aa6;min-width:0}
  .vhelp.narrow .r{font-size:17px;padding:4px 0}
  .vhelp.narrow .r span{font-size:13px}
  .vheard{font-size:11.5px;color:var(--accent2);padding:2px 2px 0;min-height:15px}
  .sim{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--sub);padding:2px 0}
  .sim button{border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);border-radius:999px;padding:3px 9px;font:inherit;font-size:11px;cursor:pointer}
  .sim button:hover{border-color:var(--accent)}
  .sbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sbar input{flex:1 1 150px}
  .sbar input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 11px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;outline:none}
  .sbar input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
  .qi .acts{display:flex;gap:3px;flex:0 0 auto}
  .qi .acts button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);
    color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
  .qi .acts button:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
  .plhead{display:flex;align-items:center;gap:8px;margin:0 0 6px}
  .plhead b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .plhead button{border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);border-radius:8px;padding:5px 9px;
    font-size:11.5px;cursor:pointer;font-family:inherit}
  .plhead button.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0a0c;border:0;font-weight:700}
  .side-seg{display:none;gap:2px;padding:2px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin-bottom:8px}
  .side-seg button{flex:1;border:0;background:none;color:var(--sub);font-weight:600;font-size:11px;padding:5px;border-radius:7px;cursor:pointer;font-family:inherit}
  .side-seg button.on{background:var(--glass2);color:var(--text)}
  body.wide .side-seg{display:flex}

};
const icon = (n, s = 17) =>
  `<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true">${ICONS[n] || ""}</svg>`;

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (s) => {
  s = Math.max(0, Math.round(s || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const THUMB = /^https:\/\/([a-z0-9-]+\.)*((googleusercontent|ggpht|ytimg|bandsintown)\.com|wikimedia\.org)\//i;
const thumbUrl = (u) => (u && THUMB.test(u)) ? "/api/thumb?url=" + encodeURIComponent(u) : (u || "");
const QUEUE_KEY = "spotdl-gui-queue";   // the main window's queue — same origin
const store = {
  get(k, d){ try{ const v = localStorage.getItem("mini." + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("mini." + k, JSON.stringify(v)); }catch(e){} },
};

const TABS = {cover: ["disc", "Obal"], video: ["video", "Video"], lyrics: ["lyrics", "Text"], queue: ["list", "Fronta"], search: ["search", "Hledat"]};
document.querySelectorAll(".tab").forEach(b => {
  const [ic, label] = TABS[b.dataset.tab];
  b.innerHTML = icon(ic, 14) + `<span>${label}</span>`;
  b.title = label;
  b.onclick = () => showTab(b.dataset.tab);
});
el("prev").innerHTML = icon("prev", 18);
el("next").innerHTML = icon("next", 18);
el("play").innerHTML = icon("play", 22);
el("back10").innerHTML = icon("back10", 19);
el("fwd10").innerHTML = icon("fwd10", 19);
el("mute").innerHTML = icon("volume", 16);
el("sleep").innerHTML = icon("moon", 16);
el("voicebtn").innerHTML = icon("mic", 16);
el("fullbtn").innerHTML = icon("full", 16);
el("voicebtn").onclick = () => MiniVoice.toggle();
el("gtrbtn").onclick = () => gtrSet(!GTR.on);
const toggleFull = () => document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : document.documentElement.requestFullscreen().catch(() => toast("Celá obrazovka se nepovedla"));
el("fullbtn").onclick = toggleFull;
document.addEventListener("fullscreenchange", () => el("fullbtn").classList.toggle("on", !!document.fullscreenElement));
document.addEventListener("keydown", (e) => { if(e.key === "f" && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA/.test(e.target.tagName)) toggleFull(); });
el("label").innerHTML = icon("note", 26);

let toastT = 0;
function toast(msg, ms){
  const t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms || 1800);
}

function sendRemote(action, value){
  return fetch("/api/remote/command", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action, value: value === undefined ? null : value}),
  }).catch(() => {});
}

// Every control goes through here: to the app when it plays (or is there to
// play), to the mini player's own audio when that one plays or the app isn't
// running at all.
function send(action, value){
  if(LP.active || !R.live){ if(lpHandle(action, value)) return Promise.resolve(); }
  return sendRemote(action, value);
}

// ------------------------------------------------------------- state
// The main window reports where it was at `at`; adding the time since keeps
// the bar, the lyrics and the video moving smoothly between polls.
const S = {title: "", artists: "", thumbnail: "", playing: false, volume: 1, position: 0,
           duration: 0, at: 0, videoId: null, key: null, relPath: null, live: false};
const nowPos = () => {
  if(!S.live) return 0;
  const p = S.position + (S.playing ? Math.max(0, Date.now() / 1000 - S.at) : 0);
  return S.duration > 0 ? Math.min(p, S.duration) : p;
};
let trackKey = "";

let R = {live: false, playing: false};     // what the app says it is doing
async function refresh(){
  let s = null;
  try{ s = await (await fetch("/api/remote/state?who=mini")).json(); }catch(e){}
  const rlive = !!s && !s.stale && !!(s.title || s.playing);
  const rplaying = rlive && !!s.playing;
  // The app started playing while this one plays too: it wins, this stops.
  if(LP.active && rplaying && !R.playing && !lpPaused()){
    LP.audio.pause(); if(LP.mode === "yt") lpYt("pauseVideo");
    LP.active = false; toast("Hraje aplikace");
  }
  R = {live: rlive, playing: rplaying};
  MiniVoice.first(!!s && ((!s.stale && !!s.voice) || !!s.widget));
  // A command the menu bar heard with no window listening: it opened this one for it.
  if(s && s.mini_voice && s.mini_voice.seq && store.get("voiceseq", 0) !== s.mini_voice.seq){
    store.set("voiceseq", s.mini_voice.seq);
    MiniVoice.got(s.mini_voice.r).catch(() => {});
  }
  // A song the app handed over ("play in mini"): once, also when this window only just opened.
  if(s && s.mini && s.mini.seq && store.get("playseq", 0) !== s.mini.seq){
    store.set("playseq", s.mini.seq);
    lpPlayList([stemTrack(s.mini.stems, s.mini.title, s.mini.artists)], 0);
    toast("Bez kytary: " + (s.mini.title || s.mini.stems));
    // The whole picture for playing along: video, text and the tab.
    if(mode === "compact") setSize("wide");
    if(!TB.on) el("tabbtn").click();
  }
  if(LP.active) Object.assign(S, lpState());
  else if(rlive){
    Object.assign(S, {
      title: s.title || "", artists: s.artists || "", thumbnail: s.thumbnail || "",
      playing: rplaying, volume: s.volume ?? 1, position: s.position || 0,
      duration: s.duration || 0, at: s.at || Date.now() / 1000, videoId: s.videoId || null,
      key: s.key || null, relPath: s.relPath || null, live: true,
    });
  } else Object.assign(S, {live: false, playing: false});
  const live = S.live;
  document.body.classList.toggle("local", LP.active);
  el("offline").hidden = rlive || LP.active;
  el("wrap").classList.toggle("playing", S.playing);
  el("play").innerHTML = icon(S.playing ? "pause" : "play", 22);
  el("mute").innerHTML = icon(S.volume > 0 ? "volume" : "volumeMuted", 16);
  if(document.activeElement !== el("volume")){
    el("volume").value = String(S.volume);
    el("volume").style.setProperty("--v", (S.volume * 100) + "%");
  }
  el("seek").disabled = !live;
  if("mediaSession" in navigator && LP.active) navigator.mediaSession.playbackState = S.playing ? "playing" : "paused";

  const k = live ? `${S.title}|${S.artists}` : "";
  if(k !== trackKey){ trackKey = k; onTrackChange(); }
  else if(live && S.videoId && !videoState.trackId){ videoState.trackId = S.videoId; if(shown("video")) loadVideo(); }
  checkSleep();
}

function onTrackChange(){
  const live = S.live;
  setTitle(live ? S.title || "Nic nehraje" : "Nic nehraje");
  el("artist").textContent = live ? (S.artists || "") : "Pick";
  const art = live && S.thumbnail ? thumbUrl(S.thumbnail) : "";
  el("backdrop").style.backgroundImage = art ? `url('${art}')` : "";
  el("label").style.backgroundImage = art ? `url('${art}')` : "";
  el("mart").style.backgroundImage = art ? `url('${art}')` : "";
  el("mart").innerHTML = art ? "" : icon("note", 20);
  el("label").innerHTML = art ? "" : icon("note", 26);
  pickAccent(art);
  lyrics = null; lyricsFor = "";

// The accent follows the cover: the most colourful of its pixels, brightened.
function pickAccent(url){
  const root = document.documentElement.style;
  const reset = () => { root.removeProperty("--accent"); root.removeProperty("--accent2"); };
  if(!url){ reset(); return; }
  const img = new Image();
  img.onload = () => {
    try{
      const c = document.createElement("canvas"); c.width = c.height = 24;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;
      let best = null, bestScore = -1;
      for(let i = 0; i < d.length; i += 4){
        const [r, gg, b] = [d[i], d[i+1], d[i+2]];
        const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
        const sat = mx ? (mx - mn) / mx : 0, lum = mx / 255;
        const score = sat * 1.4 + lum * .6 - (lum < .2 ? 1 : 0);
        if(score > bestScore){ bestScore = score; best = [r, gg, b]; }
      }
      if(!best || bestScore < .55){ reset(); return; }
      const [h, s] = rgbToHsl(...best);
      root.setProperty("--accent", `hsl(${h} ${Math.max(60, s)}% 55%)`);
      root.setProperty("--accent2", `hsl(${(h + 28) % 360} ${Math.max(70, s)}% 68%)`);
    }catch(e){ reset(); }
  };
  img.onerror = reset;
  img.src = url;
}
function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if(mx === mn) return [0, 0, l * 100];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [Math.round(h * 60), Math.round(s * 100), l * 100];
}

// ------------------------------------------------- vinyl (and scratching)
let spin = 0, lastFrame = performance.now(), scratch = null;
const vinyl = el("vinyl");
const angleOf = (e) => {
  const r = vinyl.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
};
const SEC_PER_TURN = 6;   // one full turn by hand = six seconds of the song
vinyl.addEventListener("pointerdown", (e) => {
  if(!S.live || !S.duration) return;
  vinyl.setPointerCapture(e.pointerId);
  scratch = {last: angleOf(e), total: 0, from: nowPos()};
});
vinyl.addEventListener("pointermove", (e) => {
  if(!scratch) return;
  const a = angleOf(e);
  let d = a - scratch.last;
  if(d > 180) d -= 360; if(d < -180) d += 360;
  scratch.last = a; scratch.total += d; spin += d;
  const target = Math.max(0, Math.min(S.duration, scratch.from + scratch.total / 360 * SEC_PER_TURN));
  el("scrub").textContent = (scratch.total >= 0 ? "⟳ " : "⟲ ") + fmt(target);
  el("scrub").classList.add("on");
});
const endScratch = () => {
  if(!scratch) return;
  if(Math.abs(scratch.total) > 4){
    const target = Math.max(0, Math.min(S.duration, scratch.from + scratch.total / 360 * SEC_PER_TURN));
    send("seek", target);
    S.position = target; S.at = Date.now() / 1000;
  }
  scratch = null;
  setTimeout(() => el("scrub").classList.remove("on"), 400);
};
vinyl.addEventListener("pointerup", endScratch);
vinyl.addEventListener("pointercancel", endScratch);

async function loadVideo(){

  let id = null;
  const forKey = trackKey;

        if(forKey !== trackKey) return;

}

// When the server can't get the video (YouTube asking it to prove it isn't a

el("video").addEventListener("error", () => {

});

const yt = {id: null, time: 0, at: 0, state: -1, ready: false, lastSeek: 0};
function ytCmd(func, args){
  const f = el("yt");
  if(!f.contentWindow || !yt.id) return;
  f.contentWindow.postMessage(JSON.stringify({event: "command", func, args: args || []}), "*");
}
function useEmbed(id){
  const f = el("yt");
  yt.id = id; yt.ready = false; yt.state = -1; yt.time = 0; yt.at = 0;
  if(!id){ f.hidden = true; f.removeAttribute("src"); return; }
  f.hidden = false;
  vmsg("");
  const start = Math.max(0, Math.floor(nowPos() + videoState.offset));
  f.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?enablejsapi=1&autoplay=1&mute=1&controls=0` +
    `&playsinline=1&rel=0&modestbranding=1&start=${start}&origin=${encodeURIComponent(location.origin)}`;
  f.onload = () => {
    // Ask the player to report its time; it answers with "infoDelivery".
    f.contentWindow.postMessage(JSON.stringify({event: "listening", id: 1}), "*");
    ytCmd("mute");
  };
}
window.addEventListener("message", (e) => {
  if(!/youtube\.com$/.test(new URL(e.origin).hostname)) return;
  if(e.source !== el("yt").contentWindow) return;      // the video pane's player only
  let d; try{ d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; }catch(err){ return; }
  if(!d) return;
  if(d.event === "onReady") yt.ready = true;
  if(d.event === "onError"){ yt.id = null; el("yt").hidden = true; vmsg("Video nejde přehrát (YouTube ho nedovoluje vložit)."); }
  const info = d.info || {};
  if(typeof info.currentTime === "number"){ yt.time = info.currentTime; yt.at = performance.now(); yt.ready = true; }
  if(typeof info.playerState === "number") yt.state = info.playerState;
});
function syncEmbed(){
  if(!yt.id || !yt.ready || !shown("video")) return;
  const target = nowPos() + videoState.offset;
  const playing = yt.state === 1;
  const cur = yt.time + (playing && yt.at ? (performance.now() - yt.at) / 1000 : 0);
  const now = performance.now();
  if(Math.abs(cur - target) > 1.2 && now - yt.lastSeek > 2500){ ytCmd("seekTo", [Math.max(0, target), true]); yt.lastSeek = now; }
  if(S.playing && !playing && yt.state !== 3 && now - yt.lastSeek > 600) ytCmd("playVideo");
  if(!S.playing && playing) ytCmd("pauseVideo");
}

function syncVideo(){
  syncEmbed();
  const v = el("video");
  if(!shown("video") || !v.getAttribute("src") || v.readyState < 2) return;
  const target = nowPos() + videoState.offset;
  if(v.duration && target > v.duration){ v.pause(); return; }
  if(Math.abs(v.currentTime - target) > 0.7) v.currentTime = Math.max(0, target);
  if(S.playing && v.paused) v.play().catch(() => {});
  if(!S.playing && !v.paused) v.pause();
}

let lyrics = null, lyricsFor = "", lyricEls = [], curLine = -1, userScrollAt = 0;
// Same per-song offset as the main player's lyrics (and the same key), so a

const lyrOffKey = () => "spotdl-gui-pb-lyrics-offset:" + (S.videoId || S.relPath || S.title || "");

function nudgeLyr(d){

async function loadLyrics(){
  const box = el("lyrics");
  if(!S.live){ box.innerHTML = '<div class="empty">Texty se načtou, až něco začne hrát.</div>'; return; }
  if(lyricsFor === trackKey) return;
  lyricsFor = trackKey;
  const forKey = trackKey;
  box.innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto 10px"></div>Hledám text…</div>';
  try{
    const qs = new URLSearchParams({q: S.title, artist: S.artists, duration: String(Math.round(S.duration || 0))});
    if(S.videoId) qs.set("video_id", S.videoId);
    lyrics = await (await fetch("/api/lyrics/search?" + qs)).json();
  }catch(e){ lyrics = null; }
  if(forKey !== trackKey) return;
  curLine = -1; lyricEls = [];
  paintLyrOffset();
  if(lyrics && lyrics.synced && lyrics.lines && lyrics.lines.length){
    box.innerHTML = lyrics.lines.map((l, i) =>
      `<p class="ln" data-i="${i}"><span class="fill">${esc(l.text || "♪")}</span></p>`).join("");
    lyricEls = [...box.querySelectorAll(".ln")];
    lyricEls.forEach(p => p.onclick = () => {
      const t = Math.max(0, lyrics.lines[+p.dataset.i].timeInMs / 1000 + lyrOffset());
      send("seek", t); S.position = t; S.at = Date.now() / 1000; userScrollAt = 0;
    });
  } else if(lyrics && lyrics.plain){
    box.innerHTML = `<div class="plain">${esc(lyrics.plain)}</div>`;
  } else {
    box.innerHTML = '<div class="empty">Text k téhle skladbě se nenašel.</div>';
  }
}
el("lyrics").addEventListener("wheel", () => { userScrollAt = Date.now(); }, {passive: true});

function syncLyrics(){
  if(!shown("lyrics") || !lyricEls.length || !lyrics || !lyrics.lines) return;   // between two songs there is no text for a moment
  const ms = (nowPos() - lyrOffset()) * 1000 + 150;
  const L = lyrics.lines;
  let i = -1;
  for(let k = 0; k < L.length; k++){ if(L[k].timeInMs <= ms) i = k; else break; }
  if(i !== curLine){
    lyricEls.forEach((p, k) => { p.classList.toggle("cur", k === i); p.classList.toggle("past", k < i); });
    curLine = i;
    // Leave the text alone for a few seconds after the user scrolled it.
    if(i >= 0 && Date.now() - userScrollAt > 4000){
      const box = el("lyrics"), p = lyricEls[i];
      box.scrollTop = p.offsetTop - box.clientHeight * 0.38;
    }
  }
  if(i >= 0){
    // The current line fills in left to right as it is sung.
    const start = L[i].timeInMs, end = L[i + 1] ? L[i + 1].timeInMs : start + (L[i].duration || 4000);
    const p = Math.max(0, Math.min(1, (ms - start) / Math.max(1, end - start)));
    lyricEls[i].style.setProperty("--p", (p * 100).toFixed(1) + "%");
  }
}

// The mini player plays by itself when the app isn't running, or when

const LP = {audio: el("lp"), list: [], idx: -1, track: null, active: false, token: 0,
  // "yt": the server couldn't get the stream (YouTube's bot check on yt-dlp),

function lpYt(func, args){
  const f = el("lpyt");

}
function lpUseYt(id){
  LP.mode = "yt";
  LP.audio.pause(); LP.audio.removeAttribute("src");
  const y = LP.yt; y.time = 0; y.at = 0; y.state = -1; y.dur = 0;
  const f = el("lpyt");
  f.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?enablejsapi=1&autoplay=1&controls=0&playsinline=1&rel=0` +

}
window.addEventListener("message", (e) => {
  const f = el("lpyt");
  if(!f || e.source !== f.contentWindow) return;
  let d; try{ d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; }catch(err){ return; }
  if(!d) return;
  if(d.event === "onError"){ toast("YouTube tuhle skladbu nedovolí přehrát"); if(LP.idx + 1 < LP.list.length) lpPlay(LP.idx + 1); return; }
  // Commands sent before the player is ready are lost: start it once it says so.
  if(d.event === "onReady" && LP.mode === "yt" && LP.active){
    lpYt("setVolume", [Math.round(LP.audio.volume * 100)]);
    lpYt("playVideo");
  }
  const info = d.info || {};
  const y = LP.yt;
  if(typeof info.currentTime === "number"){ y.time = info.currentTime; y.at = performance.now(); }
  if(typeof info.duration === "number" && info.duration > 0) y.dur = info.duration;
  if(typeof info.playerState === "number"){
    const was = y.state; y.state = info.playerState;
    if(info.playerState === 0 && was !== 0 && LP.mode === "yt" && LP.active){
      if(LP.idx + 1 < LP.list.length) lpPlay(LP.idx + 1);
    }

  if(typeof info.muted === "boolean") y.muted = info.muted;
});
const lpPaused = () => LP.mode === "yt" ? !(LP.yt.state === 1 || LP.yt.state === 3) : LP.audio.paused;
const lpTime = () => LP.mode === "yt" ? LP.yt.time + (LP.yt.state === 1 && LP.yt.at ? (performance.now() - LP.yt.at) / 1000 : 0) : (LP.audio.currentTime || 0);
LP.audio.volume = store.get("lpvol", 0.8);
function lpState(){
  const a = LP.audio, t = LP.track || {};
  const yt = LP.mode === "yt";
  return {title: t.title || "", artists: t.artists || "", thumbnail: t.thumbnail || t.image || "",
    playing: !lpPaused(), volume: yt ? (LP.yt.muted ? 0 : LP.yt.vol / 100) : (a.muted ? 0 : a.volume), position: lpTime(),
    duration: yt ? (LP.yt.dur || t.duration || 0) : (isFinite(a.duration) ? a.duration : (t.duration || 0)), at: Date.now() / 1000,
    videoId: t.videoId || null, key: t.key || null, relPath: t.relPath || null, live: true};

// A song separated in Steems plays here as the band without its guitar, and
// the guitar beside it on a second player kept in step — so "guitar on" and
// "guitar off" change what is heard without anything stopping.
const stemTrack = (name, title, artists, duration) => ({key: "stems:" + name, stems: name, title: title || name, artists: artists || "",
  duration: duration || 0, dur: duration ? fmt(duration) : ""});
const GTR = {audio: new Audio(), on: false, has: false};
GTR.audio.preload = "auto";
function gtrPaint(){
  const b = el("gtrbtn");
  b.hidden = !(LP.track && LP.track.stems && GTR.has);
  b.classList.toggle("on", GTR.on);
}
function gtrSet(on){
  if(!(LP.track && LP.track.stems)){ toast("Kytaru jde zapínat jen u písně ze Steems"); return; }
  if(!GTR.has){ toast("Tahle píseň nemá kytaru zvlášť"); return; }
  GTR.on = on; GTR.audio.muted = !on; gtrPaint();
  toast(on ? "Originální kytara zapnutá" : "Bez kytary");
}
function gtrFollow(hard){
  const a = LP.audio, g = GTR.audio;
  if(!GTR.has || !g.src) return;
  g.volume = a.volume; g.playbackRate = a.playbackRate;
  // Out of step by more than a thirtieth of a second: put it back (a touch ahead, for the time the jump itself takes).
  if(hard || Math.abs(g.currentTime - a.currentTime) > 0.03){ try{ g.currentTime = a.currentTime + (hard ? 0 : 0.012); }catch(e){} }
  if(a.paused !== g.paused){ a.paused ? g.pause() : g.play().catch(() => {}); }
}
["play", "pause", "seeked", "ratechange", "volumechange"].forEach(ev => LP.audio.addEventListener(ev, () => gtrFollow(ev === "seeked" || ev === "play")));
setInterval(() => { if(!LP.audio.paused) gtrFollow(false); }, 300);
GTR.audio.addEventListener("error", () => { GTR.has = false; gtrPaint(); });
GTR.audio.addEventListener("loadedmetadata", () => { GTR.has = true; gtrPaint(); gtrFollow(true); });
function gtrLoad(t){
  GTR.audio.pause(); GTR.has = false; GTR.on = false; GTR.audio.muted = true;
  if(t && t.stems) GTR.audio.src = `/api/stems/${encodeURIComponent(t.stems)}/guitar`; else GTR.audio.removeAttribute("src");
  gtrPaint();
}
async function lpPlayList(list, idx){
  LP.list = list.slice(); return lpPlay(idx);

async function lpPlay(i){
  if(i < 0 || i >= LP.list.length) return;
  const my = ++LP.token;
  const t = LP.list[i];
  LP.idx = i; LP.track = t; LP.active = true;
  if(LP.mode === "yt"){ lpYt("stopVideo"); LP.mode = "audio"; }
  if(R.playing) sendRemote("pause");          // never two at once
  refresh();
  let src = null;
  gtrLoad(t);
  if(t.stems) src = `/api/stems/${encodeURIComponent(t.stems)}/backing?without=guitar`;
  else if(t.relPath) src = `/api/library/stream?rel=${encodeURIComponent(t.relPath)}`;
  else{
    let id = t.videoId;
    if(!id){
      try{
        const q = t.spotifyQuery || `${t.artists || ""} ${t.title || ""}`.trim();
        id = (await (await fetch(`/api/preview?q=${encodeURIComponent(q)}`)).json()).videoId;
      }catch(e){}
    }
    if(my !== LP.token) return;
    if(!id){ toast("Tuhle skladbu se nepodařilo najít"); return lpPlay(i + 1); }
    t.videoId = id;
    src = `/api/stream/${encodeURIComponent(id)}`;
  }
  LP.audio.src = src;
  LP.audio.play().catch(() => {});
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({title: t.title || "", artist: t.artists || "",
        artwork: t.thumbnail ? [{src: thumbUrl(t.thumbnail), sizes: "512x512"}] : []});
    }catch(e){}
  }
  refresh();
}
LP.audio.addEventListener("ended", () => { if(LP.idx + 1 < LP.list.length) lpPlay(LP.idx + 1); else refresh(); });
LP.audio.addEventListener("error", () => {
  if(!LP.audio.getAttribute("src")) return;
  const t = LP.track;
  // A YouTube stream the server can't get: YouTube's own player instead.
  if(t && t.videoId && !t.relPath){ lpUseYt(t.videoId); refresh(); return; }
  toast("Skladbu se nepodařilo přehrát");
  if(LP.idx + 1 < LP.list.length) setTimeout(() => lpPlay(LP.idx + 1), 800);
});
["play", "pause"].forEach(ev => LP.audio.addEventListener(ev, () => refresh()));
// The controls, when this one plays. False = not ours (goes to the app).
function lpHandle(action, value){
  const a = LP.audio;
  if(LP.mode === "yt" && LP.track){
    switch(action){
      case "playpause": lpPaused() ? lpYt("playVideo") : lpYt("pauseVideo"); LP.active = true; setTimeout(refresh, 200); return true;
      case "play": lpYt("playVideo"); return true;
      case "pause": lpYt("pauseVideo"); return true;
      case "stop": lpYt("pauseVideo"); lpYt("seekTo", [0, true]); return true;
      case "seek": if(isFinite(value)){ lpYt("seekTo", [Math.max(0, value), true]); LP.yt.time = value; LP.yt.at = performance.now(); } refresh(); return true;
      case "prev": if(lpTime() > 3 || LP.idx <= 0){ lpYt("seekTo", [0, true]); return true; } break;
      case "volume": a.volume = Math.max(0, Math.min(1, value)); store.set("lpvol", a.volume); lpYt("unMute"); lpYt("setVolume", [Math.round(a.volume * 100)]); LP.yt.vol = a.volume * 100; LP.yt.muted = false; return true;
      case "mute": LP.yt.muted ? lpYt("unMute") : lpYt("mute"); LP.yt.muted = !LP.yt.muted; return true;
    }
  }
  switch(action){
    case "playpause":
      if(LP.track){ a.paused ? a.play().catch(() => {}) : a.pause(); LP.active = true; return true; }
      { const q = loadQueue();
        if(q.length){ lpPlayList(q, 0); toast("Hraju frontu"); }
        else { toast("Najdi hudbu v záložce Hledat"); if(mode !== "compact") showTab("search"); } }
      return true;
    case "play": if(LP.track) a.play().catch(() => {}); return !!LP.track;
    case "pause": a.pause(); return true;
    case "next": if(LP.idx + 1 < LP.list.length) lpPlay(LP.idx + 1); return true;
    case "prev": if(a.currentTime > 3 || LP.idx <= 0) a.currentTime = 0; else lpPlay(LP.idx - 1); return true;
    case "seek": if(isFinite(value)) a.currentTime = Math.max(0, value); refresh(); return true;
    case "volume": a.muted = false; a.volume = Math.max(0, Math.min(1, value)); store.set("lpvol", a.volume); return true;
    case "mute": a.muted = !a.muted; return true;
    case "stop": a.pause(); a.currentTime = 0; return true;
    case "playqueue": lpPlayList(loadQueue(), Math.round(value)); return true;
  }
  return false;
}

let libAll = null;
function libSongs(){
  if(!libAll) libAll = fetch("/api/library/browse?rel=Songs&flat=1").then(r => r.json())
    .then(d => (d.entries || []).filter(x => x.type === "file").map(x => ({key: "lib:" + x.rel, relPath: x.rel,
      title: x.title || x.name, artists: x.artist || "", album: x.album || "", dur: x.duration ? fmt(x.duration) : "",
      folder: x.rel.split("/").slice(0, -1).join("/")})))

const plain = (t) => String(t || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
// Every song separated in Steems, by band and title.
async function steemsAll(){
  let all = [];
  try{ all = (await (await fetch("/api/stems")).json()).filter(x => (x.stems || []).some(st => !/^take-|^midi/.test(st))); }catch(e){}
  return all.map(x => stemTrack(x.name, (x.meta && x.meta.title) || x.name, (x.meta && x.meta.artist) || "", x.duration))
    .sort((a, b) => (a.artists || "~").localeCompare(b.artists || "~", "cs") || a.title.localeCompare(b.title, "cs"));
}
const spTrack = (t) => ({key: "sp:" + t.id, title: t.title, artists: t.artists, thumbnail: t.image,
  spotifyQuery: `${t.artists} ${t.title}`, duration: t.duration_seconds, dur: t.duration_seconds ? fmt(t.duration_seconds) : ""});
// The folders of the library whose name has all the words, each with its songs.
function folderRows(all, words){
  const by = new Map();
  all.forEach(t => { if(!by.has(t.folder)) by.set(t.folder, []); by.get(t.folder).push(t); });
  return [...by].filter(([f]) => words.every(w => plain(f).includes(w))).sort((a, b) => a[0].localeCompare(b[0], "cs"))
    .map(([f, tracks]) => ({title: f.split("/").pop() || "Knihovna", author: `${tracks.length} ${tracks.length === 1 ? "píseň" : tracks.length < 5 ? "písně" : "písní"}${f.includes("/") ? " · " + f.split("/").slice(0, -1).join("/") : ""}`, tracks}));
}
// The app's favourite songs; one that is in Steems is the Steems song (it plays without the guitar).
async function favTracks(){
  let favs = [];
  try{ favs = JSON.parse(localStorage.getItem("spotdl-gui-fav-songs") || "[]"); }catch(e){}
  const id = (t) => plain(t.artists) + "|" + plain(t.title);
  const st = new Map((await steemsAll()).map(t => [id(t), t]));
  return favs.filter(f => f && f.title).map(f => st.get(id(f)) || (f.relPath
    ? {key: "lib:" + f.relPath, relPath: f.relPath, title: f.title, artists: f.artists || "", thumbnail: f.thumbnail}
    : f.videoId ? {key: "yt:" + f.videoId, videoId: f.videoId, title: f.title, artists: f.artists || "", thumbnail: f.thumbnail}
    : {key: "fav:" + id(f), title: f.title, artists: f.artists || "", thumbnail: f.thumbnail, spotifyQuery: `${f.artists || ""} ${f.title}`}));
}
// The bands there already are songs of: those of Steems first, then the rest of the library.
async function bandRows(words){
  const by = new Map(), seen = new Set();
  const put = (t, ready) => {
    const a = (t.artists || "").split(/\s*[,;]\s*/)[0].trim(); if(!a) return;
    const k = plain(a), s = k + "|" + plain(t.title);
    if(seen.has(s)) return; seen.add(s);
    if(!by.has(k)) by.set(k, {title: a, tracks: [], ready: 0});
    by.get(k).tracks.push(t); by.get(k).ready += ready;
  };
  (await steemsAll()).forEach(t => put(t, 1));
  (await libSongs()).forEach(t => put(t, 0));
  return [...by.values()].filter(b => words.every(w => plain(b.title).includes(w))).sort((a, b) => a.title.localeCompare(b.title, "cs"))
    .map(b => ({title: b.title, tracks: b.tracks, author: `${b.tracks.length} ${b.tracks.length === 1 ? "píseň" : b.tracks.length < 5 ? "písně" : "písní"}` + (b.ready ? ` · ${b.ready} ve Steems` : "")}));
}
const favPlaylists = () => { try{ return JSON.parse(localStorage.getItem("spotdl-gui-fav-playlists") || "[]").filter(p => p && p.browseId); }catch(e){ return []; } };

      url: t.url || (t.videoId ? "https://music.youtube.com/watch?v=" + t.videoId : ""), relPath: t.relPath,
      source: t.relPath ? "local" : "", duration_seconds: t.duration || undefined, addedAt: Date.now()});
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(l)); }catch(e){}
  }
  function drop(t){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs().filter(x => x.favKey !== keyOf(t)))); }catch(e){}
  }
  const tick = (ok) => ok ? "✓" : "—";
  function tell(st){
    const name = st.title || "píseň";
    if(st.state === "downloading") toast(`Stahuji: ${name}`);
    else if(st.state === "separating") toast(`Rozděluji na stopy: ${name}` + (st.position > 1 ? ` (${st.position}. ve frontě)` : ""));

  async function poll(){

// A small take on the app's tab dock, under the panels: the playing song's
// tab from Songsterr, one guitar part, kept in time. Saved under the same
// key and in the same shape as the app's dock (spotdl-gui-pb-tab-sync:…), so
// a tab synced in one is synced in the other; the lock is shared too.
const TB = {on: store.get("tabOn", false), key: "", songId: null, revisionId: null, trackIndex: 0,
  data: null, results: [], tracks: [], api: null, apiP: null, bars: [], tempoBars: [], tabLen: 0,
  timing: {list: [], sel: -1}, sync: null, stretch: 1, locked: false, held: false, cam: 0, token: 0, drag: null};
const TB_LETTERS = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
function tbTex(d){
  const DUR = [1, 2, 4, 8, 16, 32, 64];
  const dur = (x) => {
    let num = 1, den = 4;
    if(Array.isArray(x) && x.length === 2){ num = +x[0] || 1; den = +x[1] || 4; }
    if(num === 1 && DUR.includes(den)) return den;
    let best = 4, bd = Infinity;
    DUR.forEach(v => { const df = Math.abs(1 / v - num / den); if(df < bd){ bd = df; best = v; } });
    return best;
  };
  const note = (m) => TB_LETTERS[((Math.round(m) % 12) + 12) % 12] + (Math.floor(Math.round(m) / 12) - 1);
  const bpm = (d.tempo && d.tempo[0] && d.tempo[0].bpm) || 120;
  const parts = [`\\title "${String(d.name || "Tab").replace(/["\\]/g, "")}"`, `\\tempo ${Math.round(bpm)}`];
  if((d.tuning || []).length) parts.push(`\\tuning ${d.tuning.map(note).join(" ")}`);
  parts.push(".");
  (d.measures || []).forEach((m, mi, all) => {
    const beats = ((m.voices || [])[0] || {}).beats || [];
    if(!beats.length) parts.push("r.4");
    beats.forEach(b => {
      const v = dur(b.duration);
      const ns = (b.notes || []).filter(n => !n.rest && n.fret !== undefined && n.string !== undefined);
      const fx = (n) => (n.hammer || n.pull) ? "{h}" : "";
      if(!ns.length) parts.push(`r.${v}`);
      else if(ns.length === 1) parts.push(`${ns[0].fret}.${ns[0].string + 1}.${v}${fx(ns[0])}`);
      else parts.push(`(${ns.map(n => `${n.fret}.${n.string + 1}${fx(n)}`).join(" ")}).${v}`);
    });
    if(mi < all.length - 1) parts.push("|");
  });
  return parts.join(" ");
}
function tbBarStarts(d){
  const ev = (d.tempo || []).filter(e => e && typeof e.measure === "number" && typeof e.bpm === "number")
    .slice().sort((a, b) => (a.measure - b.measure) || ((a.position || 0) - (b.position || 0)));
  const bpmAt = (mi) => { let b = 120; for(const e of ev){ if(e.measure <= mi) b = e.bpm; else break; } return b; };
  const secs = (x, bpm) => (!Array.isArray(x) || x.length !== 2 || !+x[1]) ? 60 / bpm : (+x[0] / +x[1]) * (60 / bpm) * 4;
  const out = []; let t = 0;
  (d.measures || []).forEach((m, mi) => {
    out.push(t);
    const sig = m.signature || [4, 4], bpm = bpmAt(mi);
    let len = (((m.voices || [])[0] || {}).beats || []).reduce((a, b) => a + secs(b.duration || [1, 4], bpm), 0);
    if(len <= 0) len = ((+sig[0] || 4) * 4 / (+sig[1] || 4)) * (60 / bpm);
    t += len;
  });
  TB.tabLen = t;
  return out;
}
const tbKey = () => "spotdl-gui-pb-tab-sync:" + (S.videoId || S.relPath || S.title || "");
const tbLockKey = () => "spotdl-gui-pb-tab-lock:" + (TB.songId != null ? TB.songId : "");

function tbQuery(){

async function tbOpenTrack(idx, saved, my){

  let bar = 0;
  for(let i = 0; i < TB.bars.length; i++){ const mb = lk.findMasterBarByIndex(i); if(!mb) break; if(mb.realBounds.x <= cx) bar = i; else break; }

  if(!mb) return;

  const nx = lk.findMasterBarByIndex(bar + 1);

// --------------------------------------------------------- sleep timer
// Click cycles off → 15 → 30 → 60 min → end of this song → off.
const SLEEP_STEPS = [0, 15, 30, 60, "end"];
let sleep = {step: 0, until: 0, songKey: ""};
el("sleep").onclick = () => {
  sleep.step = (sleep.step + 1) % SLEEP_STEPS.length;
  const v = SLEEP_STEPS[sleep.step];
  sleep.until = typeof v === "number" && v ? Date.now() + v * 60000 : 0;
  sleep.songKey = trackKey;
  toast(v === 0 ? "Časovač spánku vypnut" : v === "end" ? "Usnu po konci téhle skladby" : `Usnu za ${v} min`);
  paintSleep();
};
function paintSleep(){
  const v = SLEEP_STEPS[sleep.step], b = el("sleep");
  b.classList.toggle("on", v !== 0);
  let badge = "";
  if(v === "end") badge = "♪";
  else if(v) badge = Math.max(1, Math.ceil((sleep.until - Date.now()) / 60000)) + "";
  b.innerHTML = icon("moon", 16) + (badge ? `<span class="badge">${badge}</span>` : "");
}
function checkSleep(){
  const v = SLEEP_STEPS[sleep.step];
  if(!v) return;
  const fire = v === "end"
    ? (sleep.songKey && trackKey !== sleep.songKey) || (S.duration > 0 && S.duration - nowPos() < 1.2)
    : Date.now() >= sleep.until;
  if(fire && S.playing){
    send("pause");
    sleep.step = 0; paintSleep();
    toast("Dobrou noc 🌙");
  } else if(fire && v !== "end"){ sleep.step = 0; paintSleep(); }
  else paintSleep();
}

    el("volume").value = String(v); el("volume").style.setProperty("--v", v * 100 + "%");
  }
  else if(k === "m" || k === "M") send("mute");
  else if(k === "n" || k === "N") send("next");
  else if(k === "p" || k === "P") send("prev");
  else if("1234".includes(k) && k.length === 1) showTab(Object.keys(TABS)[+k - 1]);
});

function frame(now){
  const dt = Math.min(100, now - lastFrame); lastFrame = now;
  // 33⅓ rpm, near enough — the record stands still when the music does.
  if(S.playing && !scratch) spin += dt * 0.2;
  vinyl.style.transform = `rotate(${spin % 360}deg)`;
  const pos = nowPos();
  if(!dragging){
    el("pos").textContent = fmt(pos);
    el("dur").textContent = fmt(S.duration);
    const pct = S.duration > 0 ? pos / S.duration : 0;
    el("seek").value = String(Math.round(pct * 1000));
    el("seek").style.setProperty("--v", (pct * 100).toFixed(2) + "%");
  }
  syncLyrics();
  syncVideo();
  tbFrame();
  requestAnimationFrame(frame);
}

const MiniVoice = (() => {

    constructor(o){ super(); this.ch = (o.processorOptions && o.processorOptions.ch) || 0; }

  function flush(){
    const all = new Int16Array(held);
    let o = 0;
    for(const p of parts) for(let i = 0; i < p.length; i++){ const v = Math.max(-1, Math.min(1, p[i])); all[o++] = v < 0 ? v * 32768 : v * 32767; }
    parts = []; held = 0;
    if(deaf) return;
    chain = chain.then(() => on ? fetch("/api/voice/feed?who=mini" + (helpOn ? "&menu=1" : ""), {method: "POST", body: all.buffer, headers: {"Content-Type": "application/octet-stream"}}) : null)

  }

    if(on) return;

      let dev = "", ch = "";
      try{ dev = localStorage.getItem("pick-voice-mic") || ""; ch = localStorage.getItem("pick-voice-ch") || ""; }catch(e){}
      stream = await navigator.mediaDevices.getUserMedia({audio: ch
        ? {deviceId: dev ? {exact: dev} : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: {ideal: 2}}
        : {deviceId: dev ? {exact: dev} : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1}});
      const got2 = stream.getAudioTracks()[0].getSettings().channelCount || 1;
      actx = new AudioContext({sampleRate: 16000});

    if(what === "sort"){
      const rows = srch.pl ? srch.pl.tracks : srch.list;
      if(!rows.length){ toast("Není co řadit"); return; }
      const tracks = !!srch.pl || trackMode(), by = (t) => plain(!tracks || arg === "title" ? t.title : arg === "album" ? t.album : t.artists);
      rows.sort((a, b) => (!by(a) - !by(b)) || by(a).localeCompare(by(b), "cs", {numeric: true}) || plain(a.title).localeCompare(plain(b.title), "cs", {numeric: true}));
      renderSearch(); el("sres").scrollTop = 0;
      toast("Seřazeno podle " + (!tracks || arg === "title" ? "názvu" : arg === "album" ? "alba" : "kapely"));
      return;
    }
    if(what === "page"){ const b = el("sres"); b.scrollBy({top: (arg === "+" ? 0.85 : -0.85) * b.clientHeight, behavior: "smooth"}); return; }
    if(what === "playall"){
      const rows = srch.pl ? srch.pl.tracks : (trackMode() ? srch.list : []);
      if(rows.length){ lpPlayList(rows, 0); toast(`Hraju vše (${rows.length})`); } else toast("Není co přehrát — nejdřív něco vyhledej");
      return;
    }
    if(what === "back"){ if(srch.pl){ srch.pl = null; renderSearch(); } return; }
    if(what === "playlist"){ showSearch(); setMode("folders"); el("sq").value = ""; await runSearch(); toast("Složky a playlisty v knihovně — řekni „pick“ a název"); return; }
    if(what === "song"){ const all = await libSongs(); if(all.length){ const i = Math.floor(Math.random() * all.length); lpPlayList([all[i]], 0); toast("Hraju: " + all[i].title); } return; }
    toast("Tenhle povel umí jen aplikace");
  }
  return {start, stop, toggle, first, isOn: () => on, got, choose};
})();

runSearch();          // the songs of Steems, there as soon as the search opens
Saved.paint();
refresh();
setInterval(refresh, 700);
setInterval(() => { if(shown("queue")) renderQueue(); }, 5000);
requestAnimationFrame(frame);
</script>
